<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Módulo de Timbres Pro</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            margin: 0;
            user-select: none;
        }
        h2 { margin: 4px 0 8px 0; font-size: 18px; }
        .status {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #00e676;
            border: 1px solid #333;
        }
        .btn-midi {
            background-color: #1b5e20;
            color: #ffffff;
            border: 1px solid #4caf50;
            padding: 10px;
            font-size: 13px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            max-width: 500px;
            margin-bottom: 12px;
        }
        .secao-titulo {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            margin: 8px 0 6px 0;
        }
        .grid-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 12px auto;
        }
        .btn-preset {
            background-color: #252525;
            color: #ffd54f;
            border: 2px solid #554400;
            padding: 10px 4px;
            font-size: 13px;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-preset.ativo {
            background-color: #ff8f00;
            color: #000;
            border-color: #ffe082;
        }
        .grid-timbres {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 14px auto;
        }
        .btn-timbre {
            background-color: #262626;
            color: white;
            border: 2px solid #3d3d3d;
            padding: 14px 6px;
            font-size: 14px;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-timbre.ativo {
            background-color: #0066cc;
            border-color: #3399ff;
        }
        .teste-notas {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #2c2c2c;
        }
        .btn-nota {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            padding: 16px 18px;
            margin: 0 3px;
        }
    </style>
</head>
<body>

    <h2>🎹 Módulo de Timbres Pro</h2>
    <div id="status-midi" class="status">✅ Pronto! Toque em qualquer botão abaixo.</div>
    <button class="btn-midi" onclick="ativarMIDI()">🔌 Conectar Teclado USB (MIDI)</button>

    <div class="secao-titulo">⚡ Presets Rápidos</div>
    <div class="grid-presets">
        <button class="btn-preset ativo" id="p0" onclick="usarPreset(0)">P1<br>Piano</button>
        <button class="btn-preset" id="p1" onclick="usarPreset(1)">P2<br>Rhodes</button>
        <button class="btn-preset" id="p2" onclick="usarPreset(2)">P3<br>Pad</button>
        <button class="btn-preset" id="p3" onclick="usarPreset(3)">P4<br>Brass</button>
    </div>

    <div class="secao-titulo">🎛️ Banco de Timbres (10 Sons)</div>
    <div class="grid-timbres">
        <button class="btn-timbre ativo" id="t-piano" onclick="mudarTimbre('piano', 'Piano')">🎹 Piano Acústico</button>
        <button class="btn-timbre" id="t-bright" onclick="mudarTimbre('bright', 'Bright Piano')">✨ Bright Piano</button>
        <button class="btn-timbre" id="t-rhodes" onclick="mudarTimbre('rhodes', 'Rhodes')">⚡ Rhodes / E.Piano</button>
        <button class="btn-timbre" id="t-bells" onclick="mudarTimbre('bells', 'Crystal Bells')">🔔 Crystal Bells</button>
        <button class="btn-timbre" id="t-strings" onclick="mudarTimbre('strings', 'Strings')">🎻 Strings (Cordas)</button>
        <button class="btn-timbre" id="t-pad" onclick="mudarTimbre('pad', 'Warm Pad')">☁️ Warm Pad</button>
        <button class="btn-timbre" id="t-organ" onclick="mudarTimbre('organ', 'Órgão Gospel')">⛪ Órgão Gospel</button>
        <button class="btn-timbre" id="t-brass" onclick="mudarTimbre('brass', 'Brass')">🎺 Brass / Metais</button>
        <button class="btn-timbre" id="t-lead" onclick="mudarTimbre('lead', 'Synth Lead')">🚀 Synth Lead</button>
        <button class="btn-timbre" id="t-bass" onclick="mudarTimbre('bass', 'Synth Bass')">🎸 Sub / Synth Bass</button>
    </div>

    <div class="teste-notas">
        <p style="margin:0 0 8px 0; font-size:13px; color:#bbb;">Testar som na tela:</p>
        <button class="btn-nota" onclick="tocarTeste(60)">Dó (C4)</button>
        <button class="btn-nota" onclick="tocarTeste(64)">Mi (E4)</button>
        <button class="btn-nota" onclick="tocarTeste(67)">Sol (G4)</button>
    </div>

    <script>
        var ac = null;
        var timbreAtual = 'piano';
        var nomeAtual = 'Piano';
        var vozes = {};

        function msg(texto) {
            document.getElementById('status-midi').innerText = texto;
        }

        function ligarAudio() {
            if (!ac) {
                var Ctx = window.AudioContext || window.webkitAudioContext;
                ac = new Ctx();
            }
            if (ac.state === 'suspended') {
                ac.resume();
            }
        }

        function limparBotoes() {
            document.getElementById('t-piano').className = 'btn-timbre';
            document.getElementById('t-bright').className = 'btn-timbre';
            document.getElementById('t-rhodes').className = 'btn-timbre';
            document.getElementById('t-bells').className = 'btn-timbre';
            document.getElementById('t-strings').className = 'btn-timbre';
            document.getElementById('t-pad').className = 'btn-timbre';
            document.getElementById('t-organ').className = 'btn-timbre';
            document.getElementById('t-brass').className = 'btn-timbre';
            document.getElementById('t-lead').className = 'btn-timbre';
            document.getElementById('t-bass').className = 'btn-timbre';
        }

        function limparPresets() {
            document.getElementById('p0').className = 'btn-preset';
            document.getElementById('p1').className = 'btn-preset';
            document.getElementById('p2').className = 'btn-preset';
            document.getElementById('p3').className = 'btn-preset';
        }

        function mudarTimbre(id, nome) {
            ligarAudio();
            timbreAtual = id;
            nomeAtual = nome;
            limparBotoes();
            limparPresets();
            document.getElementById('t-' + id).className = 'btn-timbre ativo';
            msg('🎵 Timbre: ' + nome);
        }

        function usarPreset(num) {
            ligarAudio();
            limparBotoes();
            limparPresets();
            document.getElementById('p' + num).className = 'btn-preset ativo';

            if (num === 0) {
                timbreAtual = 'piano'; nomeAtual = 'Piano';
                document.getElementById('t-piano').className = 'btn-timbre ativo';
            } else if (num === 1) {
                timbreAtual = 'rhodes'; nomeAtual = 'Rhodes';
                document.getElementById('t-rhodes').className = 'btn-timbre ativo';
            } else if (num === 2) {
                timbreAtual = 'pad'; nomeAtual = 'Warm Pad';
                document.getElementById('t-pad').className = 'btn-timbre ativo';
            } else if (num === 3) {
                timbreAtual = 'brass'; nomeAtual = 'Brass';
                document.getElementById('t-brass').className = 'btn-timbre ativo';
            }
            msg('⚡ Preset P' + (num + 1) + ': ' + nomeAtual);
        }

        function tocarTeste(nota) {
            msg('🔊 Tocando ' + nomeAtual + '...');
            tocarNota(nota, 115);
            setTimeout(function() { pararNota(nota); }, 600);
        }

        function tocarNota(nota, vel) {
            ligarAudio();
            if (vozes[nota]) pararNota(nota);

            var agora = ac.currentTime;
            var freq = 440 * Math.pow(2, (nota - 69) / 12);
            var vol = (vel / 127) * 0.5;

            var osc1 = ac.createOscillator();
            var osc2 = ac.createOscillator();
            var filtro = ac.createBiquadFilter();
            var ganho = ac.createGain();

            var atk = 0.01, dec = 0.3, sus = 0.5, rel = 0.4, mix = 0.4;

            osc1.frequency.setValueAtTime(freq, agora);
            osc2.frequency.setValueAtTime(freq, agora);
            filtro.type = 'lowpass';

            if (timbreAtual === 'piano') {
                osc1.type = 'triangle'; osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2, agora);
                filtro.frequency.setValueAtTime(2200, agora);
                atk = 0.005; dec = 0.45; sus = 0.25; rel = 0.5; mix = 0.25;
            } else if (timbreAtual === 'bright') {
                osc1.type = 'sawtooth'; osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(freq * 2, agora);
                filtro.frequency.setValueAtTime(3400, agora);
                atk = 0.004; dec = 0.4; sus = 0.3; rel = 0.45; mix = 0.5;
            } else if (timbreAtual === 'rhodes') {
                osc1.type = 'sine'; osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(freq * 3, agora);
                filtro.frequency.setValueAtTime(1400, agora);
