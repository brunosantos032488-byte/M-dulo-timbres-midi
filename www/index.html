<!DOCTYPE html>
<html>
<body style="background:#000; color:#fff; text-align:center; padding:40px; font-family:sans-serif;">
  <h1 id="txt">TESTE DE TOQUE</h1>
  <button style="font-size:24px; padding:30px; background:green; color:white; border:none; border-radius:12px;"
    onclick="document.getElementById('txt').innerText='FUNCIONOU!'; var c=new AudioContext(); var o=c.createOscillator(); o.connect(c.destination); o.start(); setTimeout(()=>o.stop(),400);">
    TOQUE AQUI
  </button>
</body>
</html>
