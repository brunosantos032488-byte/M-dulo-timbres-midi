<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Módulo de Timbres Pro</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        h2 {
            margin: 4px 0 8px 0;
            font-size: 18px;
        }
        .status {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #00e676;
            border: 1px solid #333;
        }
        .btn-midi {
            background-color: #1b5e20;
            color: #ffffff;
            border: 1px solid #4caf50;
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            max-width: 500px;
            margin-bottom: 12px;
        }
        .secao-titulo {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0 6px 0;
        }
        .grid-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 12px auto;
        }
        .btn-preset {
            background-color: #252525;
            color: #ffd54f;
            border: 2px solid #554400;
            padding: 10px 4px;
            font-size: 13px;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-preset.ativo {
            background-color: #ff8f00;
            color: #000;
            border-color: #ffe082;
        }
        .grid-timbres {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 14px auto;
        }
        .btn-timbre {
            background-color: #262626;
            color: white;
            border: 2px solid #3d3d3d;
            padding: 14px 6px;
            font-size: 14px;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-timbre.ativo {
            background-color: #0066cc;
            border-color: #3399ff;
        }
        .teste-notas {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #2c2c2c;
        }
        .teste-notas p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #bbb;
        }
        .btn-nota {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            padding: 16px 18px;
            margin: 0 3px;
        }
        .btn-nota:active {
            background-color: #00c853;
            color: #000;
        }
    </style>
</head>
<body>

    <h2>🎹 Módulo de Timbres Pro</h2>
    <div id="status-midi" class="status">✅ Toque em qualquer botão abaixo!</div>
    <button type="button" class="btn-midi" onclick="ativarMIDI()">🔌 Conectar Teclado USB (MIDI)</button>

    <div class="secao-titulo">⚡ Presets Rápidos (Toque para ativar)</div>
    <div class="grid-presets">
        <button type="button" class="btn-preset ativo" id="preset-0" onclick="clicarPreset(0)">P1<br><span id="lbl-p0">Piano</span></button>
        <button type="button" class="btn-preset" id="preset-1" onclick="clicarPreset(1)">P2<br><span id="lbl-p1">Rhodes</span></button>
        <button type="button" class="btn-preset" id="preset-2" onclick="clicarPreset(2)">P3<br><span id="lbl-p2">Pad</span></button>
        <button type="button" class="btn-preset" id="preset-3" onclick="clicarPreset(3)">P4<br><span id="lbl-p3">Brass</span></button>
    </div>

    <div class="secao-titulo">🎛️ Banco de Timbres (10 Sons)</div>
    <div class="grid-timbres">
        <button type="button" class="btn-timbre ativo" id="timbre-piano" onclick="escolherTimbre('piano', 'Piano', this)">🎹 Piano Acústico</button>
        <button type="button" class="btn-timbre" id="timbre-bright_piano" onclick="escolherTimbre('bright_piano', 'B.Piano', this)">✨ Bright Piano</button>
        <button type="button" class="btn-timbre" id="timbre-rhodes" onclick="escolherTimbre('rhodes', 'Rhodes', this)">⚡ Rhodes / E.Piano</button>
        <button type="button" class="btn-timbre" id="timbre-bells" onclick="escolherTimbre('bells', 'Bells', this)">🔔 Crystal Bells</button>
        <button type="button" class="btn-timbre" id="timbre-strings" onclick="escolherTimbre('strings', 'Strings', this)">🎻 Strings (Cordas)</button>
        <button type="button" class="btn-timbre" id="timbre-pad" onclick="escolherTimbre('pad', 'Pad', this)">☁️ Warm Pad</button>
        <button type="button" class="btn-timbre" id="timbre-organ" onclick="escolherTimbre('organ', 'Órgão', this)">⛪ Órgão Gospel</button>
        <button type="button" class="btn-timbre" id="timbre-brass" onclick="escolherTimbre('brass', 'Brass', this)">🎺 Brass / Metais</button>
        <button type="button" class="btn-timbre" id="timbre-lead" onclick="escolherTimbre('lead', 'Lead', this)">🚀 Synth Lead</button>
        <button type="button" class="btn-timbre" id="timbre-bass" onclick="escolherTimbre('bass', 'Bass', this)">🎸 Sub / Synth Bass</button>
    </div>

    <div class="teste-notas">
        <p>Testar som na tela (toque para soar):</p>
        <button type="button" class="btn-nota" onclick="tocarPulso(60)">Dó (C4)</button>
        <button type="button" class="btn-nota" onclick="tocarPulso(64)">Mi (E4)</button>
        <button type="button" class="btn-nota" onclick="tocarPulso(67)">Sol (G4)</button>
    </div>

    <script>
        var ac = null;
        var timbreAtual = 'piano';
        var nomeCurtoAtual = 'Piano';
        var vozesAtivas = {};

        var presets = {
            p0: { timbre: 'piano', label: 'Piano' },
            p1: { timbre: 'rhodes', label: 'Rhodes' },
            p2: { timbre: 'pad', label: 'Pad' },
            p3: { timbre: 'brass', label: 'Brass' }
        };

        function setStatus(msg) {
            var el = document.getElementById('status-midi');
            if (el) el.innerText = msg;
        }

        function garantirAudio() {
            try {
                if (!ac) {
                    var AudioCtx = window.AudioContext || window.webkitAudioContext;
                    ac = new AudioCtx();
                }
                if (ac.state === 'suspended') {
                    ac.resume();
                }
            } catch (e) {
                setStatus("❌ Erro áudio: " + e.message);
            }
        }

        function escolherTimbre(id, nome, botao) {
            setStatus("🎵 Timbre selecionado: " + nome);
            garantirAudio();
            timbreAtual = id;
            nomeCurtoAtual = nome;

            var todos = document.querySelectorAll('.btn-timbre');
            todos.forEach(function(b) { b.classList.remove('ativo'); });

            if (botao) {
                botao.classList.add('ativo');
            } else {
                var alvo = document.getElementById('timbre-' + id);
                if (alvo) alvo.classList.add('ativo');
            }

            var btnsP = document.querySelectorAll('.btn-preset');
            btnsP.forEach(function(b) { b.classList.remove('ativo'); });
        }

        function clicarPreset(index) {
            var chave = 'p' + index;
            var p = presets[chave];
            if (!p) return;

            escolherTimbre(p.timbre, p.label, null);

            var btnsP = document.querySelectorAll('.btn-preset');
            btnsP.forEach(function(b) { b.classList.remove('ativo'); });
            var btn = document.getElementById('preset-' + index);
            if (btn) btn.classList.add('ativo');

            setStatus("⚡ Preset P" + (index + 1) + " ativo (" + p.label + ")");
        }

        function tocarPulso(notaMidi) {
            setStatus("🔊 Tocando nota MIDI " + notaMidi + " (" + nomeCurtoAtual + ")");
            tocarNota(notaMidi, 115);
            setTimeout(function() {
                pararNota(notaMidi);
            }, 650);
        }

        function midiParaFreq(nota) {
            return 440 * Math.pow(2, (nota - 69) / 12);
        }

        function tocarNota(notaMidi, velocidade) {
            garantirAudio();
            if (!ac) return;
            if (vozesAtivas[notaMidi]) pararNota(notaMidi);

            var agora = ac.currentTime;
            var freq = midiParaFreq(notaMidi);
            var vol = ((velocidade || 100) / 127) * 0.5;

            var osc1 = ac.createOscillator();
            var osc2 = ac.createOscillator();
            var filtro = ac.createBiquadFilter();
            var ganho = ac.createGain();

            var attack = 0.01, decay = 0.3, sustain = 0.5, release = 0.4;
            var mixOsc2 = 0.4;

            osc1.frequency.setValueAtTime(freq, agora);
            osc2.frequency.setValueAtTime(freq, agora);
            filtro.type = 'lowpass';

            if (timbreAtual === 'piano') {
                osc1.type = 'triangle';
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2, agora);
                filtro.frequency.setValueAtTime(2200, agora);
                attack = 0.005; decay = 0.45; sustain = 0.25; release = 0.5;
                mixOsc2 = 0.25;
            } else if (timbreAtual === 'bright_piano') {
